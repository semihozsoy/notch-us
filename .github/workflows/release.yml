name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: UNIVERSAL=1 VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Zip
        run: ditto -c -k --keepParent build/NotchUs.app build/NotchUs.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/NotchUs.zip --title "Notch Us $GITHUB_REF_NAME 🌮" --generate-notes

      - name: Bump Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        if: env.TAP_TOKEN != ''
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 build/NotchUs.zip | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/semihozsoy/homebrew-tap.git" tap
          cd tap
          sed -i '' -e "s/^  version \".*\"/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/notch-us.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "notch-us $VERSION"
          git push
